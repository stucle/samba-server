[global]
   workgroup        = WORKGROUP
   server string    = Maverick

   # ---- Kit-only keys -------------------------------------------------------
   # NOT real Samba parameters. setup.sh reads them, substitutes the
   # placeholders used further down and strips these lines from the installed
   # /etc/samba/smb.conf (so Samba never sees them). Edit here, then re-run setup.sh.
   #
   # Allow-list: loopback, Tailscale IPv4 (CGNAT), Tailscale IPv6 (ULA)
   HOSTS_ALLOW       = 127.0.0.1 100.64.0.0/10 fd7a:115c:a1e0::/48
   #
   # Log files live in the same folder, same naming logic: <prefix>-<YYYYMMDD>-<index>.log
   # The index goes up (and a new file is started) once the file reaches the MB cap.
   SAMBA_LOG_PREFIX  = samba
   SAMBA_LOG_MAX_MB  = 10
   ROTATE_LOG_PREFIX = rotate
   ROTATE_LOG_MAX_MB = 10
   # Days to keep old log files (both kinds)
   LOG_KEEP_DAYS     = 30
   # How often samba-logroll runs, in minutes (checks the size caps, starts the next index)
   CRON_LOG          = 120
   # Extra daily run at this time (HH:MM, server time zone). 00:00 = right at the date change,
   # so the new day's log file starts immediately.
   ROLL_DAILY_AT     = 00:00
   # --------------------------------------------------------------------------

   # Listen on loopback + Tailscale only — not on the public interface
   interfaces           = lo tailscale0
   bind interfaces only = yes
   smb ports            = 445
   hosts allow          = @HOSTS_ALLOW@

   # Logging. smbd always writes to the stable name <SAMBA_LOG_PREFIX>.log in log/.
   # When it reaches the cap (or the day changes) samba-logroll moves it to
   # log/archived/<prefix>-<date>-<index>.log and tells smbd to reopen the fresh file.
   # smbd's own size-based rename to *.old would fight with that, so it is off (0);
   # the size cap is SAMBA_LOG_MAX_MB above, enforced by samba-logroll.
   log file         = /home/ubuntu/samba/log/@SAMBA_LOG_PREFIX@.log
   max log size     = 0
   logging          = file
   # becareful: read guideline.md for tuning log cron (CRON_LOG), log size and log level together!
   log level        = 1

   # Security
   server role      = standalone server
   map to guest     = never

   # Ubuntu's samba package ships usershares; this kit does not use them.
   usershare allow guests = no
   usershare max shares   = 0

   # Global connection cap
   max connections  = 10

[sharing]
   path             = /home/ubuntu/samba
   comment          = Sharing
   browseable       = yes
   valid users      = reader groot
   read list        = reader
   write list       = groot
   read only        = yes
   create mask      = 0664
   directory mask   = 0775
   force group      = ubuntu
